<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KosHunter - Katalog Kos Mahasiswa</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigasi Responsif -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">KosHunter</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Beranda (Daftar Kos)</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah-kos.html">Tambah Data Kos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container mb-5">
        
        <!-- Header & Tombol Interaktif -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="h4 text-primary fw-bold mb-0">Daftar Kos Tersedia</h2>
                <p class="text-muted small mb-0">Total kos terdaftar: <span id="total-kos" class="fw-bold text-dark">0</span> unit</p>
            </div>
            <!-- Tombol jQuery SlideToggle Form -->
            <button id="btn-toggle-form" class="btn btn-outline-primary btn-sm">+ Toggle Form Tambah Cepat</button>
        </div>

        <!-- Section Form Tambah Cepat (Default Hidden pakai jQuery slideToggle) -->
        <div id="section-form-tambah" class="card shadow-sm border-0 p-3 mb-4" style="display: none;">
            <h5 class="h6 text-secondary fw-bold mb-3">Tambah Kos Secara Dinamis</h5>
            
            <div id="notif-sukses" class="alert alert-success py-2 small" style="display: none;">
                Data kos berhasil ditambahkan!
            </div>

            <form id="form-tambah-kos" class="row g-2">
                <div class="col-md-4">
                    <input type="text" id="input-nama" class="form-control form-control-sm" placeholder="Nama Kos" required>
                </div>
                <div class="col-md-3">
                    <select id="input-jenis" class="form-select form-select-sm">
                        <option value="Putri">Khusus Putri</option>
                        <option value="Putra">Khusus Putra</option>
                        <option value="Campur">Campur</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" id="input-harga" class="form-control form-control-sm" placeholder="Harga/Bulan (Rp)" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success btn-sm w-100">Simpan</button>
                </div>
            </form>
        </div>

        <!-- Tabel Render Dinamis -->
        <div class="card shadow-sm border-0 p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th>No</th>
                            <th>Foto</th>
                            <th>Nama Kos</th>
                            <th>Jenis Kos</th>
                            <th>Harga / Bulan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-kos-body">
                        <!-- Data di-render dinamis oleh JavaScript/jQuery -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 text-muted border-top bg-white mt-auto">
        <small>&copy; 2026 KosHunter - Muhammad Lauza Nabil (103022400118)</small>
    </footer>

    <!-- Library jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Script JavaScript & jQuery -->
    <script src="script.js"></script>
</body>
</html>
