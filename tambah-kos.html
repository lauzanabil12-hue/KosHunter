<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Kos Baru - KosHunter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>KosHunter</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Beranda (Daftar Kos)</a></li>
                    <li><a href="tambah-kos.html">Tambah Data Kos</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Formulir Tambah Data Kos Baru</h2>
            <p>Silakan isi informasi di bawah ini untuk mengunggah data kos.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nama_kos">Nama Kos:</label>
                    <input type="text" id="nama_kos" name="nama_kos" placeholder="Contoh: Kos Mawar" required>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori:</label>
                    <select id="kategori" name="kategori">
                        <option value="putri">Khusus Putri</option>
                        <option value="putra">Khusus Putra</option>
                        <option value="campur">Campur</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="harga">Harga / Bulan (Rp):</label>
                    <input type="number" id="harga" name="harga" placeholder="850000" required>
                </div>

                <div class="form-group">
                    <label for="tanggal">Tanggal Tersedia:</label>
                    <input type="date" id="tanggal" name="tanggal">
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat Lengkap:</label>
                    <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap..."></textarea>
                </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi & Fasilitas Tambahan:</label>
                    <textarea id="deskripsi" name="deskripsi" rows="4" placeholder="Fasilitas, peraturan, dll..."></textarea>
                </div>

                <button type="submit">Simpan Data Kos</button>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 KosHunter - Muhammad Lauza Nabil (103022400118)</p>
        </footer>
    </div>
</body>
</html>
