<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Kos Baru - KosHunter</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigasi Responsif -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">KosHunter</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda (Daftar Kos)</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah-kos.html">Tambah Data Kos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4">
                    <h2 class="h4 text-primary fw-bold mb-2">Formulir Tambah Data Kos Baru</h2>
                    <p class="text-muted mb-4">Silakan isi informasi di bawah ini untuk mengunggah data kos.</p>

                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label for="nama_kos" class="form-label font-weight-bold">Nama Kos:</label>
                            <input type="text" class="form-control" id="nama_kos" name="nama_kos" placeholder="Contoh: Kos Mawar" required>
                        </div>

                        <div class="mb-3">
                            <label for="kategori" class="form-label">Kategori:</label>
                            <select class="form-select" id="kategori" name="kategori">
                                <option value="putri">Khusus Putri</option>
                                <option value="putra">Khusus Putra</option>
                                <option value="campur">Campur</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="harga" class="form-label">Harga / Bulan (Rp):</label>
                            <input type="number" class="form-control" id="harga" name="harga" placeholder="850000" required>
                        </div>

                        <div class="mb-3">
                            <label for="tanggal" class="form-label">Tanggal Tersedia:</label>
                            <input type="date" class="form-control" id="tanggal" name="tanggal">
                        </div>

                        <div class="mb-3">
                            <label for="alamat" class="form-label">Alamat Lengkap:</label>
                            <textarea class="form-control" id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="deskripsi" class="form-label">Deskripsi & Fasilitas Tambahan:</label>
                            <textarea class="form-control" id="deskripsi" name="deskripsi" rows="4" placeholder="Fasilitas, peraturan, dll..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-success px-4">Simpan Data Kos</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 text-muted border-top bg-white">
        <small>&copy; 2026 Aplikasi KosHunter </small>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
